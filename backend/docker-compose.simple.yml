version: '3.8'

# Cloud SQLのみを使用するシンプル構成
# ローカルPostgreSQLは使わない

services:
  # Cloud SQL Proxy
  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:latest
    container_name: mealmind-cloud-sql-proxy
    command:
      - "--port=5432"
      - "${CLOUD_SQL_CONNECTION_NAME}"
    ports:
      - "5432:5432"
    volumes:
      - ~/.config/gcloud:/root/.config/gcloud:ro
    networks:
      - mealmind-network
    restart: unless-stopped

  # バックエンドAPI
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mealmind-backend
    ports:
      - "8000:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@cloud-sql-proxy:5432/${DB_NAME}
    depends_on:
      - cloud-sql-proxy
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
    networks:
      - mealmind-network

networks:
  mealmind-network:
    driver: bridge
