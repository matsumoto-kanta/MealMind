version: '3.8'

services:
  # バックエンドAPI
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mealmind-backend
    ports:
      - "8000:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    depends_on:
      - db
    volumes:
      # ホットリロード用にソースをマウント（開発時のみ）
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
    networks:
      - mealmind-network

  # PostgreSQLデータベース（ローカル開発用）
  db:
    image: postgres:15-alpine
    container_name: mealmind-db
    environment:
      - POSTGRES_USER=${DB_USER:-dbuser}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
      - POSTGRES_DB=${DB_NAME:-mealmind}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mealmind-network

  # pgAdmin（データベース管理ツール・オプション）
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mealmind-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@mealmind.local
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - mealmind-network
    profiles:
      - tools  # docker-compose --profile tools up で起動

volumes:
  postgres_data:

networks:
  mealmind-network:
    driver: bridge
