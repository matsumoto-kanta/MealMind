steps:
  # Docker イメージをビルド
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}'
      - '-t'
      - '${_IMAGE_NAME}'
      - '.'
    dir: '.'

  # イメージをプッシュ
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_IMAGE_NAME}'

# ビルドしたイメージ
images:
  - '${_IMAGE_NAME}'

# 置換変数
substitutions:
  _NEXT_PUBLIC_API_URL: 'https://mealmind-backend-p5mpmtryka-an.a.run.app'
  _IMAGE_NAME: 'asia-northeast1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/mealmind-frontend/mealmind-frontend:${SHORT_SHA}'

options:
  substitutionOption: 'ALLOW_LOOSE'
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
