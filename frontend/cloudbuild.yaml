steps:
  # Docker イメージをビルド
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=https://mealmind-backend-p5mpmtryka-an.a.run.app'
      - '-t'
      - '$$IMAGE_NAME'
      - '.'

  # イメージをプッシュ
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$$IMAGE_NAME'

# ビルドしたイメージ
images:
  - '$$IMAGE_NAME'

# 自動的に生成される置換変数を使用
# IMAGE_NAME は gcloud run deploy によって自動設定される

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
